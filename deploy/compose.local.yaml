# Local database only. API/runner and Vite run from their own repository terminals.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: summary
      POSTGRES_USER: summary
      POSTGRES_PASSWORD: summary
    ports: ['127.0.0.1:5432:5432']
    volumes: [summary-local:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U summary -d summary']
      interval: 5s
      retries: 10
volumes:
  summary-local:
