# Immutable image digests must be supplied by the reviewed release manifest.
x-backend: &backend
  image: ${BACKEND_IMAGE:?Set backend image digest}
  env_file: ${APP_ENV_FILE:?Set absolute path to runtime environment}
  networks: [internal]
  volumes:
    - ${SECRETS_DIR:?Set secret directory}:/run/secrets:ro
  read_only: true
  tmpfs: [/tmp:size=64m,mode=1777]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  ulimits:
    core: {soft: 0, hard: 0}
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set PostgreSQL 16 image digest}
    environment:
      POSTGRES_DB: summary
      POSTGRES_USER: summary
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - summary-db:/var/lib/postgresql/data
      - ${SECRETS_DIR}:/run/secrets:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U summary -d summary']
      interval: 5s
      retries: 10
  migrate:
    <<: *backend
    command: ['alembic', 'upgrade', 'head']
    profiles: [migration]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      retries: 5
  runner:
    <<: *backend
    command: ['python', '-m', 'app.runner']
    restart: unless-stopped
    stop_grace_period: 31m
    depends_on:
      postgres: {condition: service_healthy}
    tmpfs: [/tmp:size=64m,mode=1777, /run/summary-data:size=512m,uid=10001,gid=10001,mode=0700]
    deploy:
      replicas: 1
  frontend:
    image: ${FRONTEND_IMAGE:?Set frontend image digest}
    ports: ['443:443']
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:?Set certificate directory}:/etc/nginx/tls:ro
    networks: [internal]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
networks:
  internal:
volumes:
  summary-db:
